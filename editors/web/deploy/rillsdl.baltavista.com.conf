# rillsdl.baltavista.com — the model editor, in its container on 8765.
# Written to the baltavista box's shape: the front nginx routes :443 by
# SNI to 127.0.0.1:8444 with proxy_protocol, and certbot's webroot is
# /var/www/html — so the TLS block goes in after
#   certbot certonly --webroot -w /var/www/html -d rillsdl.baltavista.com
server {
    listen 80;
    listen [::]:80;
    server_name rillsdl.baltavista.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    server_name rillsdl.baltavista.com;

    ssl_certificate     /etc/letsencrypt/live/rillsdl.baltavista.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rillsdl.baltavista.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    set_real_ip_from 127.0.0.1/32;
    real_ip_header CF-Connecting-IP;

    # A run can take the thirty seconds the server allows it.
    proxy_read_timeout 60s;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

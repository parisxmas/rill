<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rill · Valley</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=396">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05060c; }
    canvas { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
    /* Left-aligned and pre-wrapped, not centred. What lands here is no longer
       one short line: the no-adapter message names two settings pages and a
       diagnostic one, and centring a block of instructions makes every line
       start somewhere different, which is the hardest way to read a list of
       things to go and click. */
    .err { position: fixed; inset: 0; overflow: auto; z-index: 11;
           background: rgba(6, 6, 12, 0.94); padding: 2rem;
           color: #c9c3e4; font: 13px/1.7 ui-monospace, monospace;
           white-space: pre-wrap; }












    /* Who are you. Only asked when joining somebody else's valley, and it is
       part of the loading screen rather than a dialogue in front of it —
       there is nothing else on that screen to interrupt, and a name is
       something the server needs before this browser can be let in. */
    .who { margin-top: 20px; display: flex; gap: 8px; }
    .who input {
      flex: 1; min-width: 0; background: #10101c; border: 1px solid #2b2a40;
      color: #e8e4da; padding: 7px 9px;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.14em; outline: none;
    }
    .who input:focus { border-color: #f6c02e; }
    .who button {
      background: #f6c02e; border: 0; color: #10101c; padding: 7px 14px;
      font: 600 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer;
    }
    .who small { display: block; margin-top: 8px; color: #6f6a8c;
                 font: 11px/1.5 ui-monospace, monospace; letter-spacing: 0.1em; }



    /* Where you type. Underneath the log rather than over it, and only there
       while you are actually typing: a text field on screen at all times is a
       text field the eye keeps checking, and this is a game that is mostly
       played with the mouse. Return opens it, return sends, escape gives up. */
    .chat {
      position: fixed; left: 20px; bottom: 50px; width: 320px;
      display: none; align-items: baseline; gap: 8px;
      font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.06em;
    }
    .chat.on { display: flex; }
    .chat span { color: #57c26a; }
    /* Its own field rather than a contenteditable: an input is what a browser
       already knows how to put a cursor in, and the border is the only thing
       here that says the keys are going somewhere other than the valley. */
    .chat input {
      flex: 1; min-width: 0; background: rgba(8, 7, 14, 0.78);
      border: 1px solid rgba(87, 194, 106, 0.55); border-radius: 2px;
      padding: 3px 6px; color: #e8e4da; outline: none;
      font: inherit; letter-spacing: inherit;
    }


    /* The loader. It covers the canvas until a frame has actually been drawn
       on it, so nobody watches a black rectangle wondering whether it works. */
    .boot {
      position: fixed; inset: 0; z-index: 10; background: #05060c;
      display: grid; place-items: center;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      transition: opacity 700ms ease;
    }
    .boot.gone { opacity: 0; pointer-events: none; }
    .boot .inner { width: min(360px, 74vw); }
    .boot h1 {
      margin: 0 0 22px; font-size: 15px; letter-spacing: 0.28em; color: #f6c02e;
      font-weight: 600;
    }
    .boot .track { height: 2px; background: #1b1a2c; overflow: hidden; }
    .boot .track i {
      display: block; height: 100%; width: 0; background: #f6c02e;
      transition: width 200ms ease;
    }
    .boot .row {
      display: flex; justify-content: space-between; gap: 12px;
      margin-top: 10px; color: #6f6a8c;
    }
    .boot .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .boot .pct { color: #9a94b8; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="chat" id="chat"><span>say</span><input id="chatin" maxlength="120"
       autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <div class="boot" id="boot">
    <div class="inner">
      <h1>RILL &nbsp;VALLEY</h1>
      <div class="track"><i id="bar"></i></div>
      <div class="row">
        <span class="what" id="what">asking for a GPU</span>
        <span class="pct" id="pct">0%</span>
      </div>
      <form class="who" id="who" style="display:none">
        <input id="name" maxlength="8" placeholder="WHO ARE YOU" autocomplete="off" spellcheck="false">
        <input id="word" maxlength="16" placeholder="WORD" autocomplete="off" spellcheck="false" style="flex:0 0 5.5rem">
        <button type="submit">enter</button>
      </form>
      <small id="whonote" style="display:none">a name of letters and digits, eight at most — and the word you were given</small>
    </div>
  </div>
  <script type="module">
    // Versioned because the CDN in front of this holds files for a week; bump
    // it when anything changes. index.html itself is never cached.
    //
    // The wasm carries the same number, and that is not decoration: a rebuilt
    // world.wasm behind an unversioned URL is served from cache, and what you
    // get is new renderer against old world — which looks exactly like the fix
    // you just made not working.
    const AV = "396";

    // The page's own modules — host.js, net.js, world.js — ride inside
    // valley.rpak with everything else, so the first and only asset request
    // this boot makes is the bundle. The three are *stored*, never
    // compressed: the LZ half of the format belongs to the engine, and the
    // engine is inside world.wasm, which world.js has to load first. The
    // boot only reads the directory — name, method, offset — and slices.
    const bar0 = document.getElementById("bar");
    const what0 = document.getElementById("what");
    const pct0 = document.getElementById("pct");
    const pakBytes = await (async () => {
      const r = await fetch(`./valley.rpak?v=${AV}`);
      if (!r.ok) throw new Error(`valley.rpak: ${r.status}`);
      const size = +(r.headers.get("Content-Length") || 0);
      const reader = r.body.getReader();
      const parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value);
        got += value.length;
        if (size) {
          const f = Math.min(1, got / size);
          // A sliver of the bar: the loader proper restarts the count when
          // it takes over, and a bar that ran to 100 and snapped back reads
          // as a crash. The percent in the corner tells the real story.
          bar0.style.width = `${(f * 4).toFixed(1)}%`;
          what0.textContent = "valley.rpak";
          pct0.textContent = `${Math.round(f * 100)}%`;
        }
      }
      const all = new Uint8Array(got);
      let o = 0;
      for (const c of parts) { all.set(c, o); o += c.length; }
      return all;
    })();

    // The directory, by hand: u8 name length, the name, u8 method, then
    // raw/packed/offset as little-endian u32s. Enough to find a stored file;
    // anything packed is the engine's business later.
    const takeStored = (want) => {
      const dv = new DataView(pakBytes.buffer, pakBytes.byteOffset, pakBytes.byteLength);
      if (dv.getUint32(0, false) !== 0x5250414b) throw new Error("valley.rpak is not an RPAK file");
      const count = dv.getUint32(8, true);
      const dataAt = 16 + dv.getUint32(12, true);
      const dec = new TextDecoder();
      let o = 16;
      for (let i = 0; i < count; i++) {
        const nl = dv.getUint8(o);
        const name = dec.decode(pakBytes.subarray(o + 1, o + 1 + nl));
        const method = dv.getUint8(o + 1 + nl);
        const packed = dv.getUint32(o + 6 + nl, true);
        const off = dv.getUint32(o + 10 + nl, true);
        if (name === want) {
          if (method !== 0) throw new Error(`${want} is compressed — the boot cannot read it`);
          return pakBytes.subarray(dataAt + off, dataAt + off + packed);
        }
        o += 14 + nl;
      }
      throw new Error(`${want} is not in valley.rpak`);
    };

    // Modules out of bytes: blob URLs, with host.js's own import lines
    // rewritten to point at them — a blob module cannot resolve "./net.js".
    const asModule = (bytes) =>
      URL.createObjectURL(new Blob([bytes], { type: "text/javascript" }));
    const netURL = asModule(takeStored("net.js"));
    const worldURL = asModule(takeStored("world.js"));
    const hostSrc = new TextDecoder().decode(takeStored("host.js"))
      .replace(/["']\.\/world\.js[^"']*["']/, JSON.stringify(worldURL))
      .replace(/["']\.\/net\.js[^"']*["']/, JSON.stringify(netURL));
    const { run } = await import(asModule(hostSrc));

    // Whose valley. `?join` takes the one this page is served from,
    // `?join=wss://box/valley` somebody else's, and no `join` at all is the
    // valley this tab has to itself — which is what a static page gets,
    // because there is no server behind one.
    //
    // The default follows the page it is on. A page served over TLS may not
    // open a plain socket, so it asks for `wss://` on the same host and lets
    // whatever is in front of it hand the connection on — one path, no port,
    // and the certificate is the one the page already came over. Served over
    // plain http, which is how this runs while it is being worked on, it goes
    // straight at the port the server listens on.
    const q = new URLSearchParams(location.search);
    const here = location.protocol === "https:"
      ? `wss://${location.host}/valley`
      : `ws://${location.hostname || "localhost"}:8091/`;
    const server = q.has("join") ? (q.get("join") || here) : null;

    // Who to put over this player's head. Only asked when there is somebody to
    // see it; the answer is kept, because nobody wants to type their own name
    // every time they reload.
    const askName = async () => {
      if (!server) return "";
      const form = document.getElementById("who");
      const field = document.getElementById("name");
      const word = document.getElementById("word");
      form.style.display = "flex";
      document.getElementById("whonote").style.display = "block";
      field.value = localStorage.getItem("valley.name") ?? "";
      field.focus();
      field.select();
      const given = await new Promise((res) => {
        form.addEventListener("submit", (e) => { e.preventDefault(); res(field.value.trim()); }, { once: true });
      });
      // The word travels in the query of the socket's own address, where the
      // server can refuse it before it answers the handshake — no protocol, no
      // round trip, and nothing allocated for somebody who does not have it.
      // Not kept: a name is worth remembering between visits and a shared word
      // is not.
      pass = word.value.trim();
      form.style.display = "none";
      document.getElementById("whonote").style.display = "none";
      // The same rule the server applies, applied here so that what somebody
      // types is what they see over their own head. The server still checks
      // it — this field is not where the rule lives, it is only where it is
      // polite about it — and the server may still hand back a number on the
      // end if the name was already somebody else's.
      const name = given.replace(/[^A-Za-z0-9]/g, "").slice(0, 8);
      if (name) localStorage.setItem("valley.name", name);
      return name;
    };
    let pass = "";
    const name = await askName();
    // Who this browser is, as far as the valley is concerned. The server mints
    // it on the first visit and hands it back in `hello`; from then on it
    // travels in the query beside the word, and it is what makes a name stay
    // yours between visits — see `who somebody is` in server.rill.
    //
    // Not a password: it is never typed, it cannot be recovered, and anybody
    // who copies it out of this browser is this player. It is kept here rather
    // than in a cookie because nothing else needs to see it, least of all
    // whatever is proxying the socket.
    const who = localStorage.getItem("valley.who") ?? "";
    // `?join` may already carry a query of its own.
    const query = [
      pass ? "p=" + encodeURIComponent(pass) : "",
      who ? "who=" + encodeURIComponent(who) : "",
    ].filter(Boolean).join("&");
    const door = server && query
      ? server + (server.includes("?") ? "&" : "?") + query
      : server;
    const boot = document.getElementById("boot");
    const bar = document.getElementById("bar");
    const what = document.getElementById("what");
    const pct = document.getElementById("pct");

    // The HUD — the stat corner included — is the engine's now: host.js
    // pushes the lines straight into the wasm display list, so there is no
    // element here to fill and nothing to do twice a second.
    run(document.getElementById("c"), `./world.wasm?v=${AV}`, () => {}, (done, total, label) => {
      bar.style.width = `${(done / total * 100).toFixed(0)}%`;
      pct.textContent = `${Math.round(done / total * 100)}%`;
      what.textContent = label;
    }, door, name, pakBytes).then(() => {
      // `run` resolves on the first submitted frame, so the fade is over
      // something rather than over nothing.
      boot.classList.add("gone");
      // Removed on the transition, or on a timer if that never comes.
      //
      // A background tab does not run transitions, and it does not run
      // requestAnimationFrame either — so switching away during the load and
      // coming back left the curtain frozen half-faded over a running valley,
      // for ever, because the one event that was going to remove it had already
      // been missed. The timer is the same 700ms the CSS is, with room.
      const drop = () => boot.remove();
      boot.addEventListener("transitionend", drop, { once: true });
      setTimeout(drop, 1200);
    }).catch(e => {
      console.error("SETUP FAILED", e.stack || e);
      boot.remove();
      // textContent, not an interpolated string: the message is now several
      // lines with slashes and quotes in it, and putting that through innerHTML
      // both eats the newlines and hands the page's own error text to the HTML
      // parser, which is a habit worth not having whatever the source.
      const box = document.createElement("div");
      box.className = "err";
      box.textContent = e.message;
      document.body.appendChild(box);
    });
  </script>
</body>
</html>

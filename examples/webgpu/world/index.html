  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05060c; }
    canvas { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
    /* Left-aligned and pre-wrapped, not centred. What lands here is no longer
       one short line: the no-adapter message names two settings pages and a
       diagnostic one, and centring a block of instructions makes every line
       start somewhere different, which is the hardest way to read a list of
       things to go and click. */
    .err { position: fixed; inset: 0; overflow: auto; z-index: 11;
           background: rgba(6, 6, 12, 0.94); padding: 2rem;
           color: #c9c3e4; font: 13px/1.7 ui-monospace, monospace;
           white-space: pre-wrap; }












    /* Who are you. Only asked when joining somebody else's valley, and it is
       part of the loading screen rather than a dialogue in front of it —
       there is nothing else on that screen to interrupt, and a name is
       something the server needs before this browser can be let in. */
    .who { margin-top: 20px; display: flex; gap: 8px; }
    .who input {
      flex: 1; min-width: 0; background: #10101c; border: 1px solid #2b2a40;
      color: #e8e4da; padding: 7px 9px;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.14em; outline: none;
    }
    .who input:focus { border-color: #f6c02e; }
    .who button {
      background: #f6c02e; border: 0; color: #10101c; padding: 7px 14px;
      font: 600 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer;
    }
    .who small { display: block; margin-top: 8px; color: #6f6a8c;
                 font: 11px/1.5 ui-monospace, monospace; letter-spacing: 0.1em; }



    /* Where you type. Underneath the log rather than over it, and only there
       while you are actually typing: a text field on screen at all times is a
       text field the eye keeps checking, and this is a game that is mostly
       played with the mouse. Return opens it, return sends, escape gives up. */
    .chat {
      position: fixed; left: 20px; bottom: 50px; width: 320px;
      display: none; align-items: baseline; gap: 8px;
      font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.06em;
    }
    .chat.on { display: flex; }
    .chat span { color: #57c26a; }
    /* Its own field rather than a contenteditable: an input is what a browser
       already knows how to put a cursor in, and the border is the only thing
       here that says the keys are going somewhere other than the valley. */
    .chat input {
      flex: 1; min-width: 0; background: rgba(8, 7, 14, 0.78);
      border: 1px solid rgba(87, 194, 106, 0.55); border-radius: 2px;
      padding: 3px 6px; color: #e8e4da; outline: none;
      font: inherit; letter-spacing: inherit;
    }


    /* The loader. It covers the canvas until a frame has actually been drawn
       on it, so nobody watches a black rectangle wondering whether it works. */
    .boot {
      position: fixed; inset: 0; z-index: 10; background: #05060c;
      display: grid; place-items: center;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      transition: opacity 700ms ease;
    }
    .boot.gone { opacity: 0; pointer-events: none; }
    .boot .inner { width: min(360px, 74vw); }
    .boot h1 {
      margin: 0 0 22px; font-size: 15px; letter-spacing: 0.28em; color: #f6c02e;
      font-weight: 600;
    }
    .boot .track { height: 2px; background: #1b1a2c; overflow: hidden; }
    .boot .track i {
      display: block; height: 100%; width: 0; background: #f6c02e;
      transition: width 200ms ease;
    }
    .boot .row {
      display: flex; justify-content: space-between; gap: 12px;
      margin-top: 10px; color: #6f6a8c;
    }
    .boot .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .boot .pct { color: #9a94b8; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="chat" id="chat"><span>say</span><input id="chatin" maxlength="120"
       autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <div class="boot" id="boot">
    <div class="inner">
      <h1>RILL &nbsp;VALLEY</h1>
      <div class="track"><i id="bar"></i></div>
      <div class="row">
        <span class="what" id="what">asking for a GPU</span>
        <span class="pct" id="pct">0%</span>
      </div>
      <form class="who" id="who" style="display:none">
        <input id="name" maxlength="8" placeholder="WHO ARE YOU" autocomplete="off" spellcheck="false">
        <input id="word" maxlength="16" placeholder="WORD" autocomplete="off" spellcheck="false" style="flex:0 0 5.5rem;display:none">
        <button type="submit">enter</button>
      </form>
      <small id="whonote" style="display:none">a name of letters and digits, eight at most</small>
    </div>
  </div>
  <script type="module">
    // Versioned because the CDN in front of this holds files for a week; bump
    // it when anything changes. index.html itself is never cached — and it is
    // deliberately a stub: everything that can live in the bundle does,
    // including the boot logic, the page's modules and world.wasm itself.
    // What is left here is the one thing that cannot come out of a file the
    // page has not fetched yet: fetching the file.
    const AV = "488";

    const bar = document.getElementById("bar");
    const what = document.getElementById("what");
    const pct = document.getElementById("pct");
    try {
      const pakBytes = await (async () => {
        const r = await fetch(`./valley.rpak?v=${AV}`);
        if (!r.ok) throw new Error(`valley.rpak: ${r.status}`);
        const size = +(r.headers.get("Content-Length") || 0);
        const reader = r.body.getReader();
        const parts = [];
        let got = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          parts.push(value);
          got += value.length;
          if (size) {
            const f = Math.min(1, got / size);
            // A sliver of the bar: the loader proper restarts the count when
            // it takes over, and a bar that ran to 100 and snapped back reads
            // as a crash. The percent in the corner tells the real story.
            bar.style.width = `${(f * 4).toFixed(1)}%`;
            what.textContent = "valley.rpak";
            pct.textContent = `${Math.round(f * 100)}%`;
          }
        }
        const all = new Uint8Array(got);
        let o = 0;
        for (const c of parts) { all.set(c, o); o += c.length; }
        return all;
      })();

      // The directory, by hand: u8 name length, the name, u8 method, then
      // raw/packed/offset as little-endian u32s. Enough to find a stored
      // file; anything packed is the engine's business later.
      const takeStored = (want) => {
        const dv = new DataView(pakBytes.buffer, pakBytes.byteOffset, pakBytes.byteLength);
        if (dv.getUint32(0, false) !== 0x5250414b) throw new Error("valley.rpak is not an RPAK file");
        const count = dv.getUint32(8, true);
        const dataAt = 16 + dv.getUint32(12, true);
        const dec = new TextDecoder();
        let o = 16;
        for (let i = 0; i < count; i++) {
          const nl = dv.getUint8(o);
          const name = dec.decode(pakBytes.subarray(o + 1, o + 1 + nl));
          const method = dv.getUint8(o + 1 + nl);
          const packed = dv.getUint32(o + 6 + nl, true);
          const off = dv.getUint32(o + 10 + nl, true);
          if (name === want) {
            if (method !== 0) throw new Error(`${want} is compressed — the boot cannot read it`);
            return pakBytes.subarray(dataAt + off, dataAt + off + packed);
          }
          o += 14 + nl;
        }
        throw new Error(`${want} is not in valley.rpak`);
      };

      // One module out of the bundle: page.js, which pack.rill built by
      // concatenating world.js, net.js, host.js and boot.js with the imports
      // that joined them stripped out. A blob module cannot resolve
      // "./net.js", and four of them was four entries in the network panel
      // for code that never crossed a network; this is one.
      const { boot } = await import(URL.createObjectURL(
        new Blob([takeStored("page.js")], { type: "text/javascript" })));
      await boot(pakBytes, takeStored);
    } catch (e) {
      console.error("SETUP FAILED", e.stack || e);
      document.getElementById("boot")?.remove();
      // textContent, not an interpolated string: the message is now several
      // lines with slashes and quotes in it, and putting that through
      // innerHTML both eats the newlines and hands the page's own error text
      // to the HTML parser, which is a habit worth not having whatever the
      // source.
      const box = document.createElement("div");
      box.className = "err";
      box.textContent = e.message;
      document.body.appendChild(box);
    }
  </script>
</body>
</html>

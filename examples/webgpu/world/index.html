<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rill · Valley</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05060c; }
    canvas { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
    .hud {
      position: fixed; left: 20px; top: 18px; color: #e8e4da;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      user-select: none; pointer-events: none;
    }
    .hud h1 { margin: 0; font-size: 15px; letter-spacing: 0.28em; color: #f6c02e; }
    .hud .sub { color: #9a94b8; }
    .hud .keys { margin-top: 8px; color: #6f6a8c; }
    .hud .keys b { color: #c9c3e4; font-weight: 600; }
    .stat {
      position: fixed; right: 20px; top: 18px; text-align: right; color: #6f6a8c;
      font: 12px/1.6 ui-monospace, monospace; pointer-events: none;
    }
    .stat b { color: #f6c02e; }
    .err { position: fixed; inset: 0; display: grid; place-items: center;
           color: #c9c3e4; font: 14px ui-monospace, monospace; }

    /* The crosshair: four strokes with a gap in the middle, so it marks the
       point without covering it. Each carries a dark rim, which is what keeps
       it readable over the pale peaks and over the dark water both. */
    .aim { position: fixed; inset: 0; pointer-events: none;
           display: grid; place-items: center; }
    .aim i { position: absolute; background: #fff;
             box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55); }
    .aim .h { width: 10px; height: 2px; }
    .aim .v { width: 2px; height: 10px; }
    .aim .l { transform: translateX(-11px); }
    .aim .r { transform: translateX(11px); }
    .aim .u { transform: translateY(-11px); }
    .aim .d { transform: translateY(11px); }
    .aim .dot { width: 2px; height: 2px; background: #f6c02e; }
    /* While the bolt is being worked the rifle will not fire, and the
       crosshair says so: dimmed and opened out, back when it is ready. */
    .aim i { transition: opacity 140ms ease, transform 220ms ease; }
    body.cycling .aim i { opacity: 0.28; }
    body.cycling .aim .l { transform: translateX(-16px); }
    body.cycling .aim .r { transform: translateX(16px); }
    body.cycling .aim .u { transform: translateY(-16px); }
    body.cycling .aim .d { transform: translateY(16px); }
    body.cycling .aim .dot { opacity: 0; }

    /* Health, across the whole bottom of the screen. Big, because it is the
       one number you have to read without looking at it — a bar you have to
       find is a bar you check after you are dead. It sits under everything and
       takes no input. */
    .vit {
      position: fixed; left: 0; right: 0; bottom: 0; height: 14px;
      background: rgba(8, 7, 14, 0.72); pointer-events: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .vit i {
      display: block; height: 100%; width: 100%;
      /* Green while it is fine, amber as it goes, red at the end — carried by
         the fill's own colour rather than by a number beside it, so it is
         read peripherally. */
      background: linear-gradient(90deg, #f6c02e, #8fd14f);
      transition: width 260ms ease, background 600ms ease, box-shadow 260ms ease;
    }
    /* A shove of light when it drops, so a hit registers even if you were
       looking at the sky when it landed. */
    .vit i.hurt { box-shadow: 0 0 22px rgba(255, 120, 80, 0.85); }

    /* The count, bottom left, opposite the frame stats. Same voice as the rest
       of the HUD: small, monospaced, out of the way, and the only thing in
       colour is the number that changed. */
    .tally {
      position: fixed; left: 20px; bottom: 26px; color: #6f6a8c;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      pointer-events: none; font-variant-numeric: tabular-nums;
    }
    .tally b { color: #f6c02e; font-weight: 600; }

    /* When the last crystal is gone. Not a dialogue and not a button — there
       is nothing left to decide, so it is two lines over the valley and the
       valley keeps running behind them. Pointer-events stay off so looking
       around still works: the ending is a caption, not a wall. */
    .over {
      position: fixed; inset: 0; z-index: 9; display: grid; place-content: center;
      justify-items: center; gap: 0.6rem; pointer-events: none;
      opacity: 0; transition: opacity 1600ms ease;
      background: radial-gradient(ellipse at center, rgba(4, 3, 8, 0.62), rgba(4, 3, 8, 0.92));
    }
    .over.on { opacity: 1; }
    .over span {
      font: 800 clamp(3rem, 15vw, 11rem)/0.9 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.06em; color: #f6c02e;
      text-shadow: 0 0 40px rgba(246, 192, 46, 0.35), 0 0 4px rgba(0, 0, 0, 0.9);
      /* It arrives rather than appearing: the letters ease in from wide, which
         is the difference between an ending and a popup. */
      transform: scale(1.18); transition: transform 2200ms cubic-bezier(.16,.8,.28,1);
    }
    .over.on span { transform: scale(1); }
    .over small {
      font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.22em; text-transform: uppercase; color: #f6c02e;
      opacity: 0.72;
    }
    .over em {
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      font-style: normal; letter-spacing: 0.28em; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.42);
    }

    /* The loader. It covers the canvas until a frame has actually been drawn
       on it, so nobody watches a black rectangle wondering whether it works. */
    .boot {
      position: fixed; inset: 0; z-index: 10; background: #05060c;
      display: grid; place-items: center;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      transition: opacity 700ms ease;
    }
    .boot.gone { opacity: 0; pointer-events: none; }
    .boot .inner { width: min(360px, 74vw); }
    .boot h1 {
      margin: 0 0 22px; font-size: 15px; letter-spacing: 0.28em; color: #f6c02e;
      font-weight: 600;
    }
    .boot .track { height: 2px; background: #1b1a2c; overflow: hidden; }
    .boot .track i {
      display: block; height: 100%; width: 0; background: #f6c02e;
      transition: width 200ms ease;
    }
    .boot .row {
      display: flex; justify-content: space-between; gap: 12px;
      margin-top: 10px; color: #6f6a8c;
    }
    .boot .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .boot .pct { color: #9a94b8; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <h1>RILL &nbsp;VALLEY</h1>
    <div class="sub">the world below is computed by a functional language</div>
    <div class="keys"><b>click</b> to look &nbsp;·&nbsp; <b>WASD</b> walk &nbsp;·&nbsp;
      <b>space</b> jump &nbsp;·&nbsp; <b>shift</b> sprint &nbsp;·&nbsp;
      <b>left mouse</b> fire &nbsp;·&nbsp; <b>M</b> music</div>
  </div>
  <div class="stat" id="stat"></div>
  <div class="aim">
    <i class="h l"></i><i class="h r"></i><i class="v u"></i><i class="v d"></i>
    <i class="dot"></i>
  </div>
  <div class="tally" id="tally"></div>
  <div class="vit" id="vit"><i id="vitfill"></i></div>
  <div class="over" id="over"><span>GAME OVER</span><em>the valley is dark</em><small>space to begin again</small></div>
  <div class="boot" id="boot">
    <div class="inner">
      <h1>RILL &nbsp;VALLEY</h1>
      <div class="track"><i id="bar"></i></div>
      <div class="row">
        <span class="what" id="what">asking for a GPU</span>
        <span class="pct" id="pct">0%</span>
      </div>
    </div>
  </div>
  <script type="module">
    // Versioned because the CDN in front of this holds .js for a week; bump it
    // when host.js changes. index.html itself is never cached.
    //
    // The wasm carries the same number, and that is not decoration: a rebuilt
    // world.wasm behind an unversioned URL is served from cache, and what you
    // get is new renderer against old world — which looks exactly like the fix
    // you just made not working.
    import { run } from "./host.js?v=162";
    const stat = document.getElementById("stat");
    const boot = document.getElementById("boot");
    const bar = document.getElementById("bar");
    const what = document.getElementById("what");
    const pct = document.getElementById("pct");

    run(document.getElementById("c"), "./world.wasm?v=162", (h) => {
      const gpu = h.gpuMs ? ` · GPU ${h.gpuMs.toFixed(1)} ms` : "";
      const lock = h.locked ? "" : " (measuring…)";
      stat.innerHTML =
        `<b>${h.gpuName}</b> · quality <b>${h.tier}</b>${lock}<br>` +
        `<b>${h.fps}</b> fps${gpu} · ${Math.round(h.tris / 1000)}k triangles<br>` +
        `terrain, placement, physics, matrices: <b>world.rill</b> → ` +
        `<b>${h.wasmBytes ? (h.wasmBytes / 1024).toFixed(1) + " KB" : "?"}</b> of wasm<br>` +
        `shadows · MSAA 4x · instancing · gerstner water · compute particles`;
    }, (done, total, label) => {
      bar.style.width = `${(done / total * 100).toFixed(0)}%`;
      pct.textContent = `${Math.round(done / total * 100)}%`;
      what.textContent = label;
    }).then(() => {
      // `run` resolves on the first submitted frame, so the fade is over
      // something rather than over nothing.
      boot.classList.add("gone");
      boot.addEventListener("transitionend", () => boot.remove(), { once: true });
    }).catch(e => {
      console.error("SETUP FAILED", e.stack || e);
      boot.remove();
      document.body.insertAdjacentHTML("beforeend", `<div class="err">${e.message}</div>`);
    });
  </script>
</body>
</html>

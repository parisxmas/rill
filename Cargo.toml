[workspace]
resolver = "2"
members = [
    "crates/rill_syntax",
    "crates/rill_types",
    "crates/rill_codegen",
    "crates/rill_runtime",
    "crates/rill_cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[profile.dev]
panic = "abort"

[profile.release]
lto = true
panic = "abort"
